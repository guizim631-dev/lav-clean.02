<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b4f87"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lav Clean"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><title>Entrar — Lav Clean</title></head><body>
<div class="auth">
 <section class="auth-marca"><div><img class="logo-img" src="logo.png" alt="Lav Clean — lavanderia self-service"><h2>Roupas limpas,<br>mais tempo para você!</h2><p>Praticidade, qualidade e cuidado com o que é importante.</p></div><img class="login-img" src="toalhas-cesto.svg" alt="">
 </section>
 <section class="auth-form"><div class="cartao">
  <div class="abas-auth" role="tablist"><button id="tabEntrar" class="ativa" role="tab">Entrar</button><button id="tabCadastrar" role="tab">Cadastrar</button></div>
  <div id="alerta" class="alerta" role="alert"></div>
  <form id="formEntrar" novalidate><h1>Bem-vindo de volta!</h1><p class="sub">Faça login para continuar.</p>
   <div class="campo"><label for="le">E-mail</label><input id="le" type="email" autocomplete="username" placeholder="Digite seu e-mail"><div class="erro"></div></div>
   <div class="campo"><label for="ls">Senha</label><input id="ls" type="password" autocomplete="current-password" placeholder="Digite sua senha"><div class="erro"></div></div>
   <div class="linha-opcoes"><label><input type="checkbox" id="lembrar" checked> Lembrar-me</label></div>
   <button class="btn bloco" id="btnEntrar" type="submit">Entrar</button></form>
  <form id="formCadastro" novalidate hidden><h1>Crie sua conta</h1><p class="sub">Leva menos de um minuto.</p>
   <div class="campo"><label for="cn">Nome completo</label><input id="cn" autocomplete="name"><div class="erro"></div></div>
   <div class="campo"><label for="ct">Telefone</label><input id="ct" type="tel" placeholder="(11) 91234-5678" autocomplete="tel"><div class="erro"></div></div>
   <div class="campo"><label for="ce">E-mail</label><input id="ce" type="email" autocomplete="email"><div class="erro"></div></div>
   <div class="campo"><label for="cs">Senha (mín. 6 caracteres)</label><input id="cs" type="password" autocomplete="new-password"><div class="erro"></div></div>
   <div class="campo"><label for="cc">Confirmar senha</label><input id="cc" type="password" autocomplete="new-password"><div class="erro"></div></div>
   <button class="btn bloco" id="btnCadastrar" type="submit">Criar conta</button></form>
  <div class="ou"><span>ou</span></div>
  <button type="button" id="btnGoogle" class="btn sec bloco btn-google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continuar com Google</button>
  <button type="button" id="btnInstalar" class="btn sec bloco" hidden style="margin-top:14px">Instalar app no celular</button>
  <p class="aviso-demo">Seu acesso é protegido pelo Firebase Authentication.</p>
 </div></section></div>
<script src="storage.js"></script><script src="validation.js"></script><script src="services.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js"></script><script src="app.js"></script>
<script>
Auth.aguardarSessao().then(u => { if (u) location.replace("inicio.html"); });
const $ = id => document.getElementById(id);
function aba(entrar){ $("formEntrar").hidden=!entrar; $("formCadastro").hidden=entrar; $("tabEntrar").classList.toggle("ativa",entrar); $("tabCadastrar").classList.toggle("ativa",!entrar); $("alerta").className="alerta"; }
$("btnGoogle").onclick = async () => { btnGoogle.disabled=true; const r = await Auth.entrarComGoogle(); btnGoogle.disabled=false; if(r.ok) location.href="inicio.html"; else if(r.erro) aviso(r.erro); };
$("tabEntrar").onclick=()=>aba(true); $("tabCadastrar").onclick=()=>aba(false);
function aviso(msg,ok){ const a=$("alerta"); a.textContent=msg; a.className="alerta "+(ok?"ok-box":"erro-box"); }
$("formEntrar").onsubmit = async e => {
  e.preventDefault();
  const ok = [Validacao.erro(le, Validacao.email(le.value)?"":"Informe um e-mail válido."), Validacao.erro(ls, ls.value?"":"Informe a senha.")].every(Boolean);
  if(!ok) return;
  btnEntrar.disabled=true; btnEntrar.textContent="Entrando...";
  const r = await Auth.entrar(le.value, ls.value, lembrar.checked);
  if(r.ok) location.href="inicio.html"; else { aviso(r.erro); btnEntrar.disabled=false; btnEntrar.textContent="Entrar"; }
};
$("formCadastro").onsubmit = async e => {
  e.preventDefault();
  const ok = [Validacao.erro(cn,Validacao.nome(cn.value)?"":"Informe nome e sobrenome."),
    Validacao.erro(ct,Validacao.telefone(ct.value)?"":"Telefone com DDD, 10 ou 11 dígitos."),
    Validacao.erro(ce,Validacao.email(ce.value)?"":"E-mail inválido."),
    Validacao.erro(cs,Validacao.senha(cs.value)?"":"Mínimo de 6 caracteres."),
    Validacao.erro(cc,cc.value===cs.value?"":"As senhas não coincidem.")].every(Boolean);
  if(!ok) return;
  btnCadastrar.disabled=true;
  const r = await Auth.cadastrar({nome:cn.value,telefone:ct.value,email:ce.value,senha:cs.value});
  btnCadastrar.disabled=false;
  if(r.ok) location.href="inicio.html";
  else aviso(r.erro);
};
</script></body></html>
